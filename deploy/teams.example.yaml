# Teams for a public demo server. Copy to secrets/teams.yaml on the server; the gateway
# reads it through TEAMS_CONFIG_PATH (see docker-compose.prod.yml). secrets/ is gitignored,
# so the real admin key never enters this public repository.
#
# Two kinds of key live in this file:
#   - public_demo teams. The demo page publishes their keys on purpose, so their limits are
#     what protects them: keep those small.
#   - every other team. Private. Replace each placeholder with a long random value:
#       python -c "import secrets; print(secrets.token_urlsafe(32))"
teams:
  - team_id: "demo-public"
    api_key: "demo-public-key"
    public_demo: true
    # chat-demo for questions. mock-model so the page's rate-limit burst can make its
    # point without spending Groq quota.
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["groq", "mock"]
    provider_priority: ["groq", "mock"]
    system_prompt: null
    # Shared by every visitor: one person's burst rate-limits everyone for up to a minute,
    # which is also exactly what the page is demonstrating.
    requests_per_minute: 20
    # Below Groq's own 8,000 tokens-per-minute ceiling, so the gateway refuses first rather
    # than letting Groq refuse and burn a retry.
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  - team_id: "demo-policy"
    api_key: "demo-policy-key"
    public_demo: true
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["groq", "mock"]
    provider_priority: ["groq", "mock"]
    system_prompt: null
    mandatory_system_prompt: "Do not provide medical, legal or financial advice. Refer the user to a qualified professional instead."
    response_disclaimer: "This answer was generated by an AI system and has not been reviewed by a person."
    blocked_patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"   # US social security number
      - "\\b(?:\\d[ -]*?){13,16}\\b"       # long digit runs: card numbers
      - "(?i)\\bapi[_ -]?key\\b"
    requests_per_minute: 20
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  # Only on a server that runs Ollama (8 GB of RAM or more), with OLLAMA_BASE_URL pointing
  # at it. Each provider a public team's chain names gets its own status row and outage
  # button on the page, so these add Ollama controls; demo-chain shows a Groq outage falling
  # back to a real model instead of the canned mock reply.
  #
  # - team_id: "demo-ollama"
  #   api_key: "demo-ollama-key"
  #   public_demo: true
  #   allowed_models: ["chat-demo", "mock-model"]
  #   allowed_providers: ["ollama", "mock"]
  #   provider_priority: ["ollama", "mock"]
  #   system_prompt: null
  #   requests_per_minute: 20
  #   tokens_per_minute: 0
  #   monthly_budget_usd: 1.00
  #
  # - team_id: "demo-chain"
  #   api_key: "demo-chain-key"
  #   public_demo: true
  #   allowed_models: ["chat-demo", "mock-model"]
  #   allowed_providers: ["groq", "ollama", "mock"]
  #   provider_priority: ["groq", "ollama", "mock"]
  #   system_prompt: null
  #   requests_per_minute: 20
  #   tokens_per_minute: 4000
  #   monthly_budget_usd: 1.00

  # Private. Used only by you, against /admin endpoints. Never mark this public_demo: the
  # gateway refuses to load a team that is both.
  - team_id: "team-admin"
    api_key: "REPLACE-WITH-A-LONG-RANDOM-KEY"
    allowed_models: []
    allowed_providers: []
    provider_priority: []
    system_prompt: null
    requests_per_minute: 60
    monthly_budget_usd: 0.00
    is_admin: true
