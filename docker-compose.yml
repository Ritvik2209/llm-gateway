services:
  redis:
    image: redis:latest
    container_name: gateway-redis
    ports:
      - "6379:6379"
    networks:
      - gateway-net

  prometheus:
    image: prom/prometheus
    container_name: gateway-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
    networks:
      - gateway-net

  alertmanager:
    image: prom/alertmanager
    container_name: gateway-alertmanager
    ports:
      - "9093:9093"
    volumes:
      - ./monitoring/alertmanager/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
      # The Slack credential, kept out of the committed config and out of git.
      # Copy slack_webhook_url.example beside it before starting with the slack receiver.
      - ./monitoring/alertmanager/slack_webhook_url:/etc/alertmanager/slack_webhook_url:ro
    extra_hosts:
      # The default receiver posts to a sink running on the host, so notifications can be
      # inspected without a Slack credential.
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net

  grafana:
    image: grafana/grafana
    container_name: gateway-grafana
    ports:
      - "3000:3000"
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoring/grafana/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    networks:
      - gateway-net

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: llm-gateway
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # The Dockerfile copies config/ into the image so it runs standalone, but hot reload
      # can only see edits if the directory is bind-mounted over that copy. Writable
      # because the admin API edits teams.yaml in place: the file stays the single source
      # of truth rather than being shadowed by overrides in another store.
      - ./config:/app/config
    environment:
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - OLLAMA_BASE_URL=http://host.docker.internal:11434
    depends_on:
      - redis
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - gateway-net

networks:
  gateway-net:
    driver: bridge
