# Teams for the full demo on a machine that runs Ollama. docker-compose.demo.yml points the
# gateway at this file:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# The public demo server runs the first two teams only (deploy/teams.example.yaml), because a
# 2 GB server cannot run Ollama. Here the same page gets four more tabs, so a Groq outage can
# fall back to a real local model and Ollama gets an outage button of its own.
#
# Every public_demo key below is shown on the page, so none of them is a secret. The admin key
# at the end is a published placeholder too: it is in this public repository. Before sharing
# this machine through a tunnel, change it, or point TEAMS_CONFIG_PATH at a private copy.
#
# The admin API writes limit changes back into this file, as it does with config/teams.yaml.
teams:
  # The two server teams, copied unchanged so this page shows exactly what the server shows.
  - team_id: "demo-public"
    api_key: "demo-public-key"
    public_demo: true
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["groq", "mock"]
    provider_priority: ["groq", "mock"]
    system_prompt: null
    requests_per_minute: 20
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  - team_id: "demo-policy"
    api_key: "demo-policy-key"
    public_demo: true
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["groq", "mock"]
    provider_priority: ["groq", "mock"]
    system_prompt: null
    mandatory_system_prompt: "Do not provide medical, legal or financial advice. Refer the user to a qualified professional instead."
    response_disclaimer: "This answer was generated by an AI system and has not been reviewed by a person."
    blocked_patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"   # US social security number
      - "\\b(?:\\d[ -]*?){13,16}\\b"       # long digit runs: card numbers
      - "(?i)\\bapi[_ -]?key\\b"
    requests_per_minute: 20
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  # The whole chain. A Groq outage falls back to llama3.2 on Ollama, a real answer; taking
  # Ollama down as well leaves mock.
  - team_id: "demo-chain"
    api_key: "demo-chain-key"
    public_demo: true
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["groq", "ollama", "mock"]
    provider_priority: ["groq", "ollama", "mock"]
    system_prompt: null
    requests_per_minute: 20
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  # Ollama first: real traffic to the local model, with mock behind it.
  - team_id: "demo-ollama"
    api_key: "demo-ollama-key"
    public_demo: true
    allowed_models: ["chat-demo", "mock-model"]
    allowed_providers: ["ollama", "mock"]
    provider_priority: ["ollama", "mock"]
    system_prompt: null
    requests_per_minute: 20
    # 0 = no token limit. Ollama has no provider-side ceiling to shield, unlike Groq's 8,000.
    tokens_per_minute: 0
    monthly_budget_usd: 1.00

  # The two tenants documented in docs/ARCHITECTURE.md, with the same keys and settings as
  # config/teams.yaml, published here so the page can drive them.
  #
  # team-alpha: tiers, capability routing (llama3.2 only exists on Ollama), and a default
  # system prompt that makes every answer French. No mock: a real team never falls back to
  # fabricated content.
  - team_id: "team-alpha"
    api_key: "demo-team-alpha-local-only"
    public_demo: true
    allowed_models: ["chat-general", "chat-large", "llama3.2", "openai/gpt-oss-20b"]
    allowed_providers: ["ollama", "groq"]
    provider_priority: ["groq", "ollama"]
    system_prompt: "You must always respond only in French, no matter what language the question is asked in."
    requests_per_minute: 10
    tokens_per_minute: 8000
    monthly_budget_usd: 5.00

  # team-beta: one provider and no fallback, so an Ollama outage is a 503 for this team while
  # the teams above carry on. Also the policy controls, on a local model.
  - team_id: "team-beta"
    api_key: "demo-team-beta-local-only"
    public_demo: true
    allowed_models: ["llama3.2"]
    allowed_providers: ["ollama"]
    provider_priority: ["ollama"]
    system_prompt: null
    mandatory_system_prompt: "Do not provide medical, legal or financial advice. Refer the user to a qualified professional instead."
    response_disclaimer: "This answer was generated by an AI system and has not been reviewed by a person."
    blocked_patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"   # US social security number
      - "\\b(?:\\d[ -]*?){13,16}\\b"       # long digit runs: card numbers
      - "(?i)\\bapi[_ -]?key\\b"
    requests_per_minute: 5
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  # Not public: the page never shows an admin key, and the gateway refuses to load a team that
  # is both. Same placeholder as config/teams.yaml; see the note at the top.
  - team_id: "team-admin"
    api_key: "demo-team-admin-local-only"
    allowed_models: []
    allowed_providers: []
    provider_priority: []
    system_prompt: null
    requests_per_minute: 60
    monthly_budget_usd: 0.00
    is_admin: true
