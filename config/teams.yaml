# The mock provider must only appear in a test team's chain. It returns a fixed
# "mock response" with HTTP 200, so a real team falling back to it would receive
# fabricated content indistinguishable from a successful completion.
teams:
  - team_id: "team-alpha"
    api_key: "demo-team-alpha-local-only"
    # "chat-general" and "chat-large" are tiers, not models: each resolves to a
    # different physical model per provider, so a Groq outage falls back to a
    # provider that can actually serve the request. chat-general trades latency for
    # availability; chat-large trades capability for it.
    allowed_models: ["chat-general", "chat-large", "llama3.2", "openai/gpt-oss-20b"]
    allowed_providers: ["ollama", "groq"]
    provider_priority: ["groq", "ollama"]
    system_prompt: "You must always respond only in French, no matter what language the question is asked in."
    requests_per_minute: 10
    # Sized to shield Groq's own 8,000 tokens-per-minute ceiling: the gateway
    # rejects locally rather than letting the provider reject and burn a retry.
    tokens_per_minute: 8000
    monthly_budget_usd: 5.00
  - team_id: "team-beta"
    api_key: "demo-team-beta-local-only"
    allowed_models: ["llama3.2"]
    allowed_providers: ["ollama"]
    provider_priority: ["ollama"]
    # An overridable default: injected only when the caller sends no system
    # message of their own.
    system_prompt: null
    # Policy, not a default. Injected ahead of anything the caller sends, and no
    # request shape removes it. This guarantees the instruction reaches the
    # provider; it does not guarantee the model obeys it, which is why content
    # that must not be sent at all belongs in blocked_patterns below.
    mandatory_system_prompt: "Do not provide medical, legal or financial advice. Refer the user to a qualified professional instead."
    # Appended to the response body, and emitted as a final chunk when streaming.
    response_disclaimer: "This answer was generated by an AI system and has not been reviewed by a person."
    # Rejected with 400 before any provider is called, so the content never leaves
    # the building. Case-insensitive; every message is scanned, system included.
    # Invalid regexes are refused when the config loads, not at request time.
    blocked_patterns:
      - "\\b\\d{3}-\\d{2}-\\d{4}\\b"   # US social security number
      - "\\b(?:\\d[ -]*?){13,16}\\b"       # long digit runs: card numbers
      - "(?i)\\bapi[_ -]?key\\b"
    requests_per_minute: 5
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  - team_id: "team-loadtest"
    api_key: "demo-team-loadtest-local-only"
    allowed_models: ["mock-model"]
    allowed_providers: ["mock"]
    provider_priority: ["mock"]
    system_prompt: null
    requests_per_minute: 100000
    # 0 = no token limit. The load-test team exists to measure gateway overhead, so
    # it must not be throttled on a dimension the test is not measuring.
    tokens_per_minute: 0
    monthly_budget_usd: 999999.00

  # Operational key for /admin endpoints. is_admin defaults to false for every other
  # team, so tenant keys cannot read cross-provider health or change gateway state.
  - team_id: "team-admin"
    api_key: "demo-team-admin-local-only"
    allowed_models: []
    allowed_providers: []
    provider_priority: []
    system_prompt: null
    requests_per_minute: 60
    monthly_budget_usd: 0.00
    is_admin: true
