# The mock provider must only appear in a test team's chain. It returns a fixed
# "mock response" with HTTP 200, so a real team falling back to it would receive
# fabricated content indistinguishable from a successful completion.
teams:
  - team_id: "team-alpha"
    api_key: "demo-team-alpha-local-only"
    allowed_models: ["llama3.2", "openai/gpt-oss-20b"]
    allowed_providers: ["ollama", "groq"]
    provider_priority: ["groq", "ollama"]
    system_prompt: "You must always respond only in French, no matter what language the question is asked in."
    requests_per_minute: 10
    # Sized to shield Groq's own 8,000 tokens-per-minute ceiling: the gateway
    # rejects locally rather than letting the provider reject and burn a retry.
    tokens_per_minute: 8000
    monthly_budget_usd: 5.00
  - team_id: "team-beta"
    api_key: "demo-team-beta-local-only"
    allowed_models: ["llama3.2"]
    allowed_providers: ["ollama"]
    provider_priority: ["ollama"]
    system_prompt: null
    requests_per_minute: 5
    tokens_per_minute: 4000
    monthly_budget_usd: 1.00

  - team_id: "team-loadtest"
    api_key: "demo-team-loadtest-local-only"
    allowed_models: ["mock-model"]
    allowed_providers: ["mock"]
    provider_priority: ["mock"]
    system_prompt: null
    requests_per_minute: 100000
    # 0 = no token limit. The load-test team exists to measure gateway overhead, so
    # it must not be throttled on a dimension the test is not measuring.
    tokens_per_minute: 0
    monthly_budget_usd: 999999.00

  # Operational key for /admin endpoints. is_admin defaults to false for every other
  # team, so tenant keys cannot read cross-provider health or change gateway state.
  - team_id: "team-admin"
    api_key: "demo-team-admin-local-only"
    allowed_models: []
    allowed_providers: []
    provider_priority: []
    system_prompt: null
    requests_per_minute: 60
    monthly_budget_usd: 0.00
    is_admin: true
