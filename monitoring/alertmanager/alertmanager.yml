route:
  # Slack, reading its credential from the gitignored file mounted beside this config.
  # Switching back to `webhook` sends everything to the local sink instead, which is how
  # this path is verified on a machine with no Slack credential — `python
  # scripts/alert_sink.py` then prints exactly what Slack would receive.
  receiver: slack
  # Grouping by team and provider as well as alertname means one incident produces one
  # notification per affected tenant rather than one per firing series.
  group_by: ['alertname', 'team_id', 'provider', 'provider_name', 'model']
  group_wait: 30s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - matchers:
        - severity = "critical"
      receiver: slack
      # A provider being down or a team being unable to spend is worth repeating sooner.
      repeat_interval: 1h

inhibit_rules:
  # A provider that is down will also be failing requests. Page once, about the cause.
  # This matches on `provider` because the error-rate metric labels it that way; the
  # health-based alerts carry provider_name and set `provider` explicitly so this rule
  # has a common label to match on. Without that it silently never fires.
  - source_matchers:
      - alertname = "GatewayProviderDown"
    target_matchers:
      - alertname = "GatewayProviderErrorRate"
    equal: ['provider']

  # A provider down for every model is trivially also down for each one individually.
  - source_matchers:
      - alertname = "GatewayProviderDown"
    target_matchers:
      - alertname = "GatewayProviderModelDown"
    equal: ['provider']

  # A team that has exhausted its budget is trivially also over 80% of it.
  - source_matchers:
      - alertname = "GatewayTeamBudgetExhausted"
    target_matchers:
      - alertname = "GatewayTeamApproachingBudget"
    equal: ['team_id']

receivers:
  # Verifiable without any credential: `python scripts/alert_sink.py` prints the exact
  # payload Alertmanager would deliver, which is the only part of Slack delivery that
  # carries engineering risk. The POST to Slack itself is a solved integration.
  - name: webhook
    webhook_configs:
      - url: http://host.docker.internal:5001/alerts
        send_resolved: true

  # Fully configured apart from the credential, which deliberately does not live here.
  # This file is committed to a public repository, and a Slack incoming-webhook URL is a
  # bearer credential: anyone holding it can post into the channel. So it is read from a
  # file that is gitignored and mounted into the container, and the only step to enable
  # Slack is writing that file and changing `receiver: webhook` above to `receiver: slack`.
  #
  #   cp monitoring/alertmanager/slack_webhook_url.example \
  #      monitoring/alertmanager/slack_webhook_url
  #   # then replace its contents with the real URL
  #
  # api_url_file is read at notification time, so rotating the credential is a file edit
  # and a restart rather than a config change.
  - name: slack
    slack_configs:
      - api_url_file: /etc/alertmanager/slack_webhook_url
        channel: '#llm-gateway-alerts'
        send_resolved: true
        title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        text: >-
          {{ range .Alerts }}*{{ .Annotations.summary }}*

          {{ .Annotations.description }}

          {{ if .Annotations.dashboard }}<{{ .Annotations.dashboard }}|Open dashboard>{{ end }}

          {{ end }}
