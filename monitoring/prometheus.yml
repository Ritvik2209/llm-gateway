global:
  scrape_interval: 5s
  # How often alert rules are evaluated. Kept close to the scrape interval so an alert
  # does not lag the data it is based on.
  evaluation_interval: 15s

rule_files:
  - alerts.yml

alerting:
  alertmanagers:
    - static_configs:
        - targets: ['alertmanager:9093']

scrape_configs:
  - job_name: 'llm-gateway'
    static_configs:
      - targets: ['gateway:8000']

  # Alertmanager scrapes itself into the same Prometheus so its own health is visible
  # alongside what it is alerting on.
  - job_name: 'alertmanager'
    static_configs:
      - targets: ['alertmanager:9093']
