# The full demo on your own machine, applied on top of docker-compose.yml:
#
#   docker compose -f docker-compose.yml -f docker-compose.demo.yml up -d --build
#
# Then open http://localhost:8000/ for the demo page and http://localhost:3000/ for Grafana.
#
# This is the demo server's page with every provider behind it: Groq, Ollama and mock, and six
# team tabs from config/teams.demo.yaml. Ollama runs on the host, not in Compose
# (`ollama serve`, then `ollama pull llama3.2`); docker-compose.yml already points the gateway
# at it. Without Ollama, its teams fall back or fail exactly as they would in a real outage.
#
# What changes from the plain local stack:
#   - The gateway runs in demo mode: the page at /, and outage buttons for Groq and Ollama.
#   - It reads config/teams.demo.yaml, whose demo keys the page publishes, instead of
#     config/teams.yaml. Both files are committed; neither holds a real secret.
#   - Grafana lets you view dashboards without logging in, and opens on the Operations
#     dashboard, so the page's dashboard links work straight away.
#
# Ports, Redis and Alertmanager stay as docker-compose.yml has them. Alerts go to whatever
# monitoring/alertmanager/alertmanager.yml routes them to, so a demo outage can post to Slack.

services:
  gateway:
    environment:
      - DEMO_MODE=true
      - DEMO_OUTAGE_SECONDS=${DEMO_OUTAGE_SECONDS:-60}
      # Inside the ./config bind mount from docker-compose.yml, so edits and admin API
      # changes hot-reload as they do for config/teams.yaml.
      - TEAMS_CONFIG_PATH=/app/config/teams.demo.yaml
      - DEMO_GRAFANA_URL=http://localhost:3000

  grafana:
    environment:
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      - GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH=/etc/grafana/dashboards/llm-gateway-operations.json
